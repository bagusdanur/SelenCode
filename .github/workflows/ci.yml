name: ci

# Tes nyata otomatis di setiap push ke main & PR (tanpa membuat rilis / tanpa naik versi).
# Menjalankan seluruh cargo test, kompilasi example render_welcome, dan build tes Windows.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Cargo Test & Visual Render (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Jalankan semua unit & integration tests
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --color never > /tmp/cargo_test.log 2>&1
          rc=$?
          cat /tmp/cargo_test.log
          if [ $rc -ne 0 ]; then
            python3 -c '
          import re
          txt = open("/tmp/cargo_test.log", encoding="utf-8", errors="replace").read()
          lines = [l for l in txt.splitlines() if l.strip()]
          picked = [l for l in lines if re.search(r"error(\[E\d+\])?:|panicked at|FAILED|assertion", l)]
          if not picked:
              picked = lines[-20:]
          for l in picked[:15]:
              print("::error::" + l.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          '
            exit $rc
          fi
      - name: Cek Clippy (correctness)
        env:
          CARGO_TERM_COLOR: never
        run: cargo clippy --all-targets -- -D clippy::correctness
      - name: Smoke test binary CLI Linux
        run: cargo run -- --version
      - name: Uji render frame TUI nyata (wide 116 & HP 52)
        run: |
          cargo run --example render_welcome -- /tmp/wide.dump 116 36
          cargo run --example render_welcome -- /tmp/hp.dump 52 32
          python3 -m pip install --quiet pillow
          python3 design/render_bukti.py /tmp/wide.dump /tmp/preview-wide.png
          python3 design/render_bukti.py /tmp/hp.dump /tmp/preview-hp.png
      - uses: actions/upload-artifact@v4
        with:
          name: tui-preview-png
          path: |
            /tmp/preview-wide.png
            /tmp/preview-hp.png

  test-windows:
    name: Cargo Test & Check (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Jalankan tes di Windows
        run: cargo test --test moonlit --test tui_app --test update --test nextgen --test stage1_reliability --test stage2_context_memory --test stage3_exec_model --test stage4_lsp --test stage5_autonomy --test phase2_sandbox --test phase3_verify --test phase4_benchmark --test phase5_orchestration --test phase6_worktree --test phase7_mcp_expansion --test resume_sessions --test telegram_doctor_sessions --test tui_ux_wave3 --test wave4_power_features --test audit_hardening --test token_efficiency_hermes --test hermes_full_and_perf --test skills_system --test v050_telegram_path_skills --test v051_background_review --test v056_combined_package --test v057_improvements --test v058_hermes_discipline --test v059_three_debts --test v0510_gateway_and_status --test fase2 --test fase3 --test fase6 --test loop_mock --test tools_file --test outline
      - name: Build preview selen.exe (Windows)
        run: cargo build --release
      - name: Smoke test binary selen.exe (Windows)
        run: .\target\release\selen.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: preview-selen-windows-x64.exe
          path: target/release/selen.exe
