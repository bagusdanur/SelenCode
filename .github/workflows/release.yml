name: release

# Blueprint Bagian 11: Termux memakai bionic libc (Android), jadi binary
# Termux WAJIB build untuk target aarch64-linux-android dengan Android NDK.
# Build rilis diserahkan ke GitHub Actions — laptop & HP tidak perlu compile sendiri.
# Mendukung 3 target: Termux Android (arm64), Linux x64 (juga jalan di WSL),
# dan Windows x64 (native PowerShell / Windows Terminal).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Jalankan cargo test
        run: cargo test

  android:
    name: Termux (aarch64-linux-android)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build rilis Termux
        run: cargo ndk -t arm64-v8a build --release
      - uses: actions/upload-artifact@v4
        with:
          name: selen-termux-arm64
          path: target/aarch64-linux-android/release/selen

  linux:
    name: Linux x64
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rilis Linux
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: selen-linux-x64
          path: target/release/selen

  windows:
    name: Windows x64
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tes self-update Windows
        run: cargo test --test update
      - name: Build rilis Windows
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: selen-windows-x64.exe
          path: target/release/selen.exe

  release:
    name: GitHub Release
    # Hanya untuk push tag v* — workflow_dispatch berhenti di artifact.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Ganti nama per platform agar aset rilis tidak saling menimpa.
      - name: Siapkan aset rilis
        run: |
          mkdir -p dist
          cp artifacts/selen-termux-arm64/selen dist/selen-termux-arm64
          cp artifacts/selen-linux-x64/selen dist/selen-linux-x64
          cp artifacts/selen-windows-x64.exe/selen.exe dist/selen-windows-x64.exe
          chmod +x dist/selen-termux-arm64 dist/selen-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
