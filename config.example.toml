# Contoh config SelenCode — salin ke salah satu:
#   ./selencode.toml                    (per project, didahulukan)
#   ~/.config/selencode/config.toml     (global)
# API key TIDAK ditulis di sini; tulis nama env var-nya saja.

default_provider = "router"

[providers.router]
kind = "openai"                                  # openai | anthropic | gemini
base_url = "https://router.ryukomik.com/v1"      # 9Router — provider UTAMA SelenCode
model = "ag/gemini-3-flash"                      # model yang biasa dipakai di 9Router
api_key_env = "SELENCODE_ROUTER_KEY"
# Harga opsional per 1M token — untuk estimasi biaya sesi (Fase 3).
# Kosongkan bila tidak tahu; yang ditampilkan nanti hanya jumlah token.
# price_in = 3.0
# price_out = 15.0

# [providers.openrouter]
# kind = "openai"
# base_url = "https://openrouter.ai/api/v1"
# model = "isi-model"
# api_key_env = "OPENROUTER_API_KEY"

# [providers.claude]
# kind = "anthropic"
# # base_url opsional; default https://api.anthropic.com
# model = "isi-model-claude"
# api_key_env = "ANTHROPIC_API_KEY"
# price_in = 3.0
# price_out = 15.0

# [providers.gemini]
# kind = "gemini"
# # base_url opsional; default https://generativelanguage.googleapis.com
# model = "isi-model-gemini"
# api_key_env = "GEMINI_API_KEY"

[agent]
# Giliran utama selalu berjalan tanpa batas langkah (rem memakai LoopGuard, konvergensi, & timeout).
max_output_tokens = 8192
approval = "ask"                                 # ask | auto
context_limit_tokens = 100000                    # compaction konteks memicu di 80% batas ini
max_parallel_subagents = 3                       # batas subagent delegate berjalan paralel (Fase 6)

# Penjaga loop, kesadaran anggaran langkah, & gerbang verifikasi sebelum menutup (v0.5.14/v0.5.15).
[guard]
enabled = true
budget_warning_enabled = true                    # aktifkan checkpoint sisa langkah & pemicu konvergensi belum-ada-edit
budget_warning_ratio = 0.7                       # rasio checkpoint internal untuk subagent/cron berpagu
no_edit_convergence_steps = 20                   # ambang langkah tanpa edit untuk notice konvergensi di giliran utama tanpa pagu

[shell]
allowlist = ["ls", "git status", "git diff", "cargo test"]
timeout_secs = 120

# Tenggat waktu panggilan HTTP/streaming ke provider AI (v0.5.10).
# PENTING: `[timeouts]` adalah seksi TOP-LEVEL — BUKAN sub-tabel di bawah `[providers.<nama>]`!
# Menaruhnya di bawah `[providers.<nama>.timeouts]` akan diabaikan dan memicu peringatan saat start.
[timeouts]
connect_secs = 20                                # batas sambung TCP/TLS (detik)
response_secs = 60                               # batas menunggu header respons awal provider (detik)
stream_idle_secs = 180                           # batas diam antar-potongan streaming (detik; dasar 180s)
total_secs = 600                                 # batas keras total 1 panggilan provider (detik)

# Riset web opsional (`fetch_url` & `web_search`, v0.5.28).
# Default berjalan lokal tanpa API key (`direct` + `auto`); aktifkan backend eksternal hanya bila perlu.
# [web]
# extract_backend = "direct"                     # direct (default, 0 key) | jina | firecrawl
# search_backend = "auto"                        # auto/ddg (default, 0 key) | searxng | tavily | brave | firecrawl
# searxng_url = "http://127.0.0.1:8080"          # khusus bila search_backend = "searxng"
# api_key_env = "TAVILY_API_KEY"                 # nama env API key bila memakai tavily / brave / firecrawl
# max_extract_chars = 15000                      # pagu char fetch_url sebelum spill ke .selencode/web_cache/

# Telegram Bot Gateway (`selen telegram`) — opsional.
# [telegram]
# bot_token_env = "SELENCODE_TELEGRAM_TOKEN"
# allowed_users = [123456789]                    # User ID / Chat ID yang diizinkan (cek lewat `/id`)
# approval = "ask"                               # ask | edits | auto
# approval_timeout_mins = 10                     # batas tunggu tombol persetujuan (menit; 0 = tanpa batas)
# turn_timeout_secs = 900                        # batas waktu keras 1 giliran agent (detik; default 900 = 15 menit)
# stall_notice_secs = 180                        # kirim 1 peringatan macet bila giliran diam tanpa progres (detik; default 180)
# poll_watchdog_secs = 300                       # watchdog OS-thread: keluar non-nol (restart systemd) bila polling macet (detik; default 300)
# Catatan khusus uji (BUKAN pemakaian produksi normal):
# Env `SELENCODE_TELEGRAM_API_BASE` (mis. `http://127.0.0.1:18081`) mengarahkan seluruh panggilan
# Bot API (`getUpdates`, `getFile`, kirim pesan/berkas) DAN unduhan berkas ke server uji lokal.
# Biarkan tidak diset pada pemakaian normal agar gateway terhubung ke https://api.telegram.org.

# Server MCP eksternal (Fase 7) — opsional, boleh banyak. Tool-nya muncul
# sebagai mcp__<name>__<tool> di registry mode eksekusi. Default: panggilan
# tool MCP selalu minta approval; trust = true mematikan approval untuk
# server itu saja. Server yang gagal start dilewati (selen tetap jalan).
# [[mcp_servers]]
# name = "contoh"
# command = "npx"
# args = ["-y", "@contoh/mcp-server"]
# env = { KEY = "value" }        # opsional
# trust = false                  # true = tool server ini tanpa approval
# timeout_secs = 30
